name: ProxyIP Local V1 Apply

on:
  push:
    branches:
      - feature/proxyip-local-v1
    paths:
      - scripts/apply_proxyip_local_v1.py
      - scripts/patch_proxyip_local_v1_lean.py
      - scripts/patch_proxyip_local_v1_security_ui.py
      - .github/workflows/proxyip-local-v1-apply.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/proxyip-local-v1
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache-dependency-path: combined_refactor/go.sum

      - name: Apply V1 source migration
        run: python3 scripts/apply_proxyip_local_v1.py

      - name: Apply lean local-product patch
        run: python3 scripts/patch_proxyip_local_v1_lean.py

      - name: Apply local security and UI patch
        run: python3 scripts/patch_proxyip_local_v1_security_ui.py

      - name: Format Go
        run: |
          gofmt -w combined_refactor/proxy_local.go combined_refactor/proxy_local_test.go combined_refactor/proxy_local_integration_test.go combined_refactor/server.go combined_refactor/main.go

      - name: Privacy guard
        run: |
          if grep -Rni --exclude='*.crt' -E 'rongxiaofeng|vpn\.rong|125\.120\.102\.42|45\.196\.234\.118' README.md combined_refactor; then
            echo 'Personal/private value found in generated product source.'
            exit 1
          fi

      - name: Test Go package
        working-directory: combined_refactor
        run: go test ./...

      - name: Build Windows amd64 smoke test
        working-directory: combined_refactor
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags '-s -w' -o /tmp/proxyip-optimizer-windows-amd64.exe .

      - name: Commit generated V1 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- .github/workflows/build.yml
          git add README.md combined_refactor/proxy_local.go combined_refactor/proxy_local_test.go combined_refactor/proxy_local_integration_test.go combined_refactor/index.html combined_refactor/server.go combined_refactor/main.go combined_refactor/cli.go combined_refactor/geo_warning.go combined_refactor/version.go
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat: harden local-only ProxyIP optimizer V1'
          git push origin HEAD:feature/proxyip-local-v1
