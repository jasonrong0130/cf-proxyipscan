name: CF优选IP筛选器 CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache-dependency-path: combined_refactor/go.sum

      - name: Verify product identity and safe defaults
        run: |
          grep -q 'CF优选IP筛选器' README.md
          grep -q 'CF优选IP筛选器' combined_refactor/index.html
          grep -q 'placeholder="例如 example.com' combined_refactor/index.html
          if grep -q 'value="example.com"' combined_refactor/index.html; then
            echo 'SNI example must be placeholder-only, not a persisted default.'
            exit 1
          fi

      - name: Go test
        working-directory: combined_refactor
        run: go test ./...

      - name: Windows amd64 desktop smoke build
        working-directory: combined_refactor
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags '-s -w -H=windowsgui -X main.appVersion=ci' -o ../cf-ip-selector-windows-amd64-test.exe .

      - name: Upload Windows desktop test build
        uses: actions/upload-artifact@v4
        with:
          name: cf-ip-selector-windows-amd64-test
          path: cf-ip-selector-windows-amd64-test.exe
          retention-days: 7
          if-no-files-found: error
