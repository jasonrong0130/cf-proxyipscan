name: Build ProxyIP Optimizer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build version"
        required: false
        default: "v1.0.0"
        type: string
      publish_release:
        description: "Publish a GitHub Release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache-dependency-path: combined_refactor/go.sum
      - name: Go test
        working-directory: combined_refactor
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache-dependency-path: combined_refactor/go.sum
      - name: Build
        working-directory: combined_refactor
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../release_assets
          filename="proxyip-optimizer-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -trimpath -ldflags "-s -w -H=windowsgui -X main.appVersion=${{ github.event.inputs.version }}" -o "../release_assets/${filename}" .
          else
            go build -trimpath -ldflags "-s -w -X main.appVersion=${{ github.event.inputs.version }}" -o "../release_assets/${filename}" .
          fi
          cd ../release_assets
          sha256sum "$filename" | awk '{print $1}' > "${filename}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: proxyip-optimizer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release_assets/*

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: proxyip-optimizer-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "ProxyIP Optimizer ${{ github.event.inputs.version || github.ref_name }}"
          files: artifacts/*
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
