name: Apply agreed V3 patch

on:
  push:
    branches:
      - feature/simple-status-stop-speed-v3
    paths:
      - tools/apply_v3.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/simple-status-stop-speed-v3
      - name: Apply agreed V3 changes
        run: python tools/apply_v3.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combined_refactor/index.html combined_refactor/proxy_local.go combined_refactor/proxy_local_test.go combined_refactor/proxy_local_integration_test.go
          git diff --cached --quiet && exit 0
          git commit -m "feat: simplify EDT ProxyIP eligibility and speed controls"
          git push origin HEAD:feature/simple-status-stop-speed-v3
